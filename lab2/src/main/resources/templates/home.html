<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <h1>Calculator</h1>
    <div th:switch="${error}">
        <p class="error" th:case="'NumberFormatError'">Les deux nombres doivent être valides.</p>
        <p class="error" th:case="'DivisionByZeroError'">La division par zéro est impossible.</p>
        <p class="error" th:case="'OperationFormatError'">L'opération demandée est invalide.</p>
    </div>
    <form class="calculator" th:action="@{/calculate}" method="get">
        <label for="firstNum">Premier nombre:</label>
        <input id="firstNum" name="firstNum" type="number" step="any" th:value="${firstNum}">

        <label for="secondNum">Second nombre:</label>
        <input id="secondNum" name="secondNum" type="number" step="any" th:value="${secondNum}">

        <label for="result">Résultat:</label>
        <input id="result" name="result" th:value="${result}" readonly>

        <div class="buttons">
            <button type="submit" name="operation" value="add" aria-label="Addition">+</button>
            <button type="submit" name="operation" value="subtract" aria-label="Soustraction">-</button>
            <button type="submit" name="operation" value="multiply" aria-label="Multiplication">*</button>
            <button type="submit" name="operation" value="divide" aria-label="Division">/</button>
        </div>
    </form>
</main>
</body>
</html>
