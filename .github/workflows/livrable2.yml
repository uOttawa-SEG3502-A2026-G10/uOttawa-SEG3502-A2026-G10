name: Livrable 2 - Contrats

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler et exécuter les contrats et tests
        run: bash ./gradlew clean test --no-daemon --console=plain
      - name: Conserver les rapports même en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-livrable2
          path: |
            projet/build/reports/tests/test/
            projet/build/reports/cucumber/
            projet/build/test-results/test/
          if-no-files-found: warn
