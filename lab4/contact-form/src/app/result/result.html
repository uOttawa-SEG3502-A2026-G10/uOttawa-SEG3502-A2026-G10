<h1>Informations soumises</h1>

@if (user) {
    <table>
        <thead>
        <tr>
            <th>Prénom</th>
            <th>Nom de famille</th>
            <th>Numéro de téléphone</th>
            <th>Email</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td>{{ user.firstName }}</td>
            <td>{{ user.lastName }}</td>
            <td>{{ user.phone }}</td>
            <td>{{ user.email }}</td>
        </tr>
        </tbody>
    </table>
} @else {
    <p>Aucune donnée utilisateur n'a été soumise.</p>
}
