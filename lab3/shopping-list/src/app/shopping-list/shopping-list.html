<ul class="list-group mt-4">
    @for (item of items; track $index) {
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ item }}</span>
            <button type="button" (click)="deleteItem($index)" class="btn btn-outline-danger btn-sm">Supprimer</button>
        </li>
    } @empty {
        <li class="d-flex justify-content-between align-items-center">La liste est vide.</li>
    }
</ul>
